<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>牛の一生アルバム</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  overflow-x: hidden;
}

body {
  background: #e9e5df;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  color: #3d3935;
  -webkit-text-size-adjust: 100%;
}

button,
input,
select {
  font-family: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

.app {
  width: 100%;
  max-width: 430px;
  min-height: 100vh;
  margin: 0 auto;
  background: #faf8f4;
  overflow-x: hidden;
}

.header {
  background: #ffffff;
  padding: 18px;
  border-bottom: 1px solid #eee9e2;
  position: sticky;
  top: 0;
  z-index: 10;
}

.header h1 {
  margin: 0;
  font-size: 21px;
  line-height: 1.4;
}

.header p {
  margin: 5px 0 0;
  font-size: 12px;
  color: #8b837b;
}

.screen {
  padding: 18px;
  width: 100%;
  min-width: 0;
}

.hidden {
  display: none !important;
}

.main-button {
  width: 100%;
  min-height: 52px;
  border: none;
  border-radius: 15px;
  padding: 15px;
  background: #78946b;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

.sub-button {
  width: 100%;
  min-height: 46px;
  border: 1px solid #d9d2c8;
  border-radius: 13px;
  padding: 11px 13px;
  background: white;
  color: #625b54;
  font-size: 14px;
  cursor: pointer;
  touch-action: manipulation;
}

.filter-box {
  background: white;
  padding: 15px;
  border-radius: 17px;
  margin-top: 18px;
  width: 100%;
  min-width: 0;
}

.filter-title {
  font-size: 15px;
  font-weight: bold;
  margin-bottom: 12px;
}

.filter-row {
  display: flex;
  gap: 8px;
  width: 100%;
  min-width: 0;
}

.filter-row select {
  flex: 1 1 0;
  min-width: 0;
}

select,
input {
  width: 100%;
  min-width: 0;
  min-height: 46px;
  padding: 11px;
  border: 1px solid #ded8d0;
  border-radius: 10px;
  background: #fffdfa;
  font-size: 16px;
  color: #3d3935;
}

select {
  appearance: auto;
}

input[type="number"] {
  font-size: 16px;
}

input[type="date"] {
  font-size: 16px;
}

.clear-filter {
  margin-top: 8px;
  width: 100%;
  min-height: 40px;
  padding: 9px;
  border: none;
  background: none;
  color: #78946b;
  font-size: 14px;
  cursor: pointer;
  touch-action: manipulation;
}

.list-title {
  margin-top: 22px;
  font-size: 16px;
  font-weight: bold;
}

.cow-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin-top: 12px;
  width: 100%;
}

.cow-card {
  background: white;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  cursor: pointer;
  min-width: 0;
}

.cow-card img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  background: #eee9e2;
  display: block;
}

.cow-info {
  padding: 10px;
  min-width: 0;
}

.cow-number {
  font-size: 13px;
  font-weight: bold;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.cow-name {
  font-size: 13px;
  font-weight: bold;
  color: #78946b;
  margin-top: 4px;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.cow-date {
  font-size: 11px;
  color: #99918a;
  margin-top: 4px;
  overflow-wrap: anywhere;
}

.edit-button {
  margin-top: 9px;
}

.ranking-section {
  margin-top: 25px;
  width: 100%;
  min-width: 0;
}

.ranking-title {
  font-size: 17px;
  font-weight: bold;
  margin-bottom: 10px;
  line-height: 1.5;
}

.ranking-card {
  background: white;
  border-radius: 15px;
  padding: 12px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  cursor: pointer;
  min-width: 0;
  width: 100%;
}

.rank {
  width: 35px;
  min-width: 35px;
  font-size: 18px;
  font-weight: bold;
  text-align: center;
}

.rank-photo {
  width: 52px;
  height: 52px;
  min-width: 52px;
  border-radius: 10px;
  object-fit: cover;
  background: #eee9e2;
  margin-right: 10px;
}

.rank-info {
  flex: 1;
  min-width: 0;
}

.rank-number {
  font-size: 13px;
  font-weight: bold;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.rank-name {
  margin-top: 2px;
  font-size: 12px;
  color: #78946b;
  font-weight: bold;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.rank-value {
  margin-top: 4px;
  font-size: 13px;
  color: #78946b;
  font-weight: bold;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.rank-count {
  margin-top: 3px;
  font-size: 11px;
  color: #99918a;
}

.rank-empty {
  background: white;
  padding: 20px;
  border-radius: 15px;
  color: #999;
  text-align: center;
  font-size: 13px;
  line-height: 1.6;
}

.form-section {
  background: white;
  border-radius: 17px;
  padding: 17px;
  margin-bottom: 15px;
  width: 100%;
  min-width: 0;
}

.section-title {
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 15px;
}

.field {
  margin-bottom: 14px;
}

.field:last-child {
  margin-bottom: 0;
}

label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 6px;
}

.photo-preview {
  width: 100%;
  aspect-ratio: 4 / 3;
  border-radius: 14px;
  background: #f0ece6;
  object-fit: cover;
  display: none;
  margin-top: 10px;
}

.photo-label {
  display: block;
  width: 100%;
  min-height: 48px;
  text-align: center;
  padding: 13px;
  border-radius: 12px;
  background: #eee9e2;
  color: #665f58;
  cursor: pointer;
  font-size: 14px;
  line-height: 1.5;
  touch-action: manipulation;
}

input[type="file"] {
  display: none;
}

.growth-list {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 7px;
  margin-top: 10px;
  width: 100%;
}

.growth-preview {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 9px;
  display: block;
}

.back-button {
  border: none;
  background: none;
  padding: 0 0 15px;
  color: #718963;
  font-size: 14px;
  cursor: pointer;
  touch-action: manipulation;
  min-height: 40px;
}

.album-header {
  background: white;
  border-radius: 18px;
  overflow: hidden;
  margin-bottom: 16px;
}

.album-cover {
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  display: block;
}

.album-info {
  padding: 15px;
  min-width: 0;
}

.album-number {
  font-size: 21px;
  font-weight: bold;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.album-name {
  margin-top: 5px;
  color: #78946b;
  font-size: 15px;
  font-weight: bold;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.album-basic {
  color: #817970;
  font-size: 13px;
  margin-top: 7px;
  line-height: 1.7;
}

.album-section {
  margin-top: 18px;
}

.album-section-title {
  font-size: 15px;
  font-weight: bold;
  margin-bottom: 9px;
}

.photo-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 7px;
  width: 100%;
}

.album-photo {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 12px;
  background: #eee9e2;
  display: block;
}

.detail-box {
  background: white;
  border-radius: 15px;
  padding: 15px;
  font-size: 13px;
  line-height: 1.9;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.empty {
  text-align: center;
  padding: 50px 20px;
  color: #99918a;
}

.bottom-space {
  height: 35px;
}

/* スマートフォン向け微調整 */
@media (max-width: 430px) {
  body {
    background: #faf8f4;
  }

  .app {
    max-width: none;
    width: 100%;
  }

  .header {
    padding-top: calc(15px + env(safe-area-inset-top));
    padding-left: 16px;
    padding-right: 16px;
  }

  .screen {
    padding: 15px;
  }

  .filter-row {
    gap: 6px;
  }

  .filter-row select {
    font-size: 14px;
    padding-left: 9px;
    padding-right: 9px;
  }

  .cow-grid {
    gap: 10px;
  }

  .cow-info {
    padding: 9px;
  }

  .ranking-card {
    padding: 11px;
  }

  .rank {
    width: 30px;
    min-width: 30px;
  }

  .rank-photo {
    width: 48px;
    height: 48px;
    min-width: 48px;
    margin-right: 9px;
  }

  .form-section {
    padding: 15px;
  }
}

/* とても小さいスマートフォン */
@media (max-width: 350px) {
  .screen {
    padding: 12px;
  }

  .header {
    padding-left: 13px;
    padding-right: 13px;
  }

  .filter-row {
    flex-direction: column;
  }

  .filter-row select {
    width: 100%;
  }

  .cow-grid {
    gap: 8px;
  }

  .cow-info {
    padding: 8px;
  }

  .ranking-card {
    padding: 9px;
  }

  .rank {
    width: 27px;
    min-width: 27px;
    font-size: 16px;
  }

  .rank-photo {
    width: 44px;
    height: 44px;
    min-width: 44px;
    margin-right: 8px;
  }
}

/* PCでは今まで通り中央のスマホ風表示 */
@media (min-width: 431px) {
  .app {
    box-shadow: 0 0 30px rgba(0,0,0,0.08);
  }
}

.login-screen { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
.login-box { width:100%; max-width:430px; background:white; border-radius:20px; padding:24px; box-shadow:0 4px 20px rgba(0,0,0,0.08); }
.login-box h2 { margin:0 0 8px; font-size:21px; }
.login-box p { margin:0 0 20px; color:#8b837b; font-size:13px; line-height:1.6; }
.login-error { color:#b44; font-size:13px; margin-top:10px; line-height:1.5; }
.list-header {
  margin-top: 22px;
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-width: 0;
}

.list-header .list-title {
  margin-top: 0;
  flex: 1;
  min-width: 0;
}

.sort-select {
  flex: 0 1 180px;
  min-width: 145px;
  min-height: 42px;
  padding: 8px 10px;
  border: 1px solid #ded8d0;
  border-radius: 10px;
  background: #fffdfa;
  font-size: 13px;
}

@media (max-width: 350px) {
  .list-header {
    align-items: stretch;
    flex-direction: column;
    gap: 7px;
  }

  .sort-select {
    width: 100%;
    flex: none;
  }
}</style>
</head>

<body>

<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h2>🐄 牛の一生アルバム</h2>
    <p>メールアドレスとパスワードでログインしてください。</p>
    <div class="field"><label>メールアドレス</label><input id="loginEmail" type="email" autocomplete="username" placeholder="メールアドレス"></div>
    <div class="field"><label>パスワード</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="パスワード"></div>
    <button class="main-button" onclick="login()">ログイン</button>
    <div id="loginError" class="login-error"></div>
  </div>
</div>

<div class="app" id="app" style="display:none;">

<header class="header">
  <h1>🐄 牛の一生アルバム</h1>
  <p>一頭一頭の成長を、写真で残そう</p>
</header>

<!-- ホーム -->
<main id="homeScreen" class="screen">

  <button class="main-button" onclick="showRegister()">
    ＋ 新しい牛を登録
  </button>

  <div class="filter-box">
    <div class="filter-title">🔎 牛を絞り込む</div>

    <div class="filter-row">
      <select id="motherFilter" onchange="renderCowList()">
        <option value="">母牛：すべて</option>
      </select>

      <select id="fatherFilter" onchange="renderCowList()">
        <option value="">父牛：すべて</option>
      </select>
    </div>

    <button class="clear-filter" onclick="clearFilters()">
      絞り込みを解除
    </button>
  </div>

  <div class="list-header">
  <div class="list-title">🐄 登録されている牛</div>

 <select id="cowSort" class="sort-select" onchange="renderCowList()">
  <option value="">並び替えなし</option>
  <option value="registered_desc">登録が新しい順</option>
    <option value="birth_desc">生年月日が新しい順</option>
    <option value="birth_asc">生年月日が古い順</option>
    <option value="number_asc">個体識別番号順</option>
    <option value="weight_desc">出荷体重が大きい順</option>
    <option value="price_desc">出荷価格が高い順</option>
  </select>
</div>

<div id="cowList"></div>
  <!-- 個体別ランキング -->
  <div class="ranking-section">
    <div class="ranking-title">⚖️ 出荷体重ランキング</div>
    <div id="weightRanking"></div>
  </div>

  <div class="ranking-section">
    <div class="ranking-title">💰 出荷価格ランキング</div>
    <div id="priceRanking"></div>
  </div>

  <!-- 母牛別ランキング -->
  <div class="ranking-section">
    <div class="ranking-title">
      🐄 母牛別・平均出荷体重ランキング
    </div>
    <div id="motherWeightRanking"></div>
  </div>

  <div class="ranking-section">
    <div class="ranking-title">
      💰 母牛別・平均出荷価格ランキング
    </div>
    <div id="motherPriceRanking"></div>
  </div>

  <!-- 父牛別ランキング -->
  <div class="ranking-section">
    <div class="ranking-title">
      🐂 父牛別・平均出荷体重ランキング
    </div>
    <div id="fatherWeightRanking"></div>
  </div>

  <div class="ranking-section">
    <div class="ranking-title">
      💰 父牛別・平均出荷価格ランキング
    </div>
    <div id="fatherPriceRanking"></div>
  </div>

  <div class="bottom-space"></div>

</main>


<!-- 登録・編集画面 -->
<main id="registerScreen" class="screen hidden">

  <button class="back-button" onclick="showHome()">
    ← 牛の一覧に戻る
  </button>

  <section class="form-section">

    <div class="section-title">🐄 基本情報</div>

    <div class="field">
      <label>個体番号</label>
      <input
        id="cowNumber"
        type="text"
        placeholder="例：1234567890"
        autocomplete="off"
      >
    </div>

    <div class="field">
      <label>子牛の名前</label>
      <input
        id="cowName"
        type="text"
        placeholder="例：まめきち"
        autocomplete="off"
      >
    </div>

    <div class="field">
     <label>生年月日</label>
<div class="filter-row">
  <select id="birthYear"></select>
  <select id="birthMonth"></select>
  <select id="birthDay"></select>
</div>
    </div>

    <div class="field">
      <label>性別</label>

      <select id="gender">
        <option value="">選択してください</option>
        <option value="メス">♀ メス</option>
        <option value="オス">♂ オス</option>
      </select>
    </div>

    <div class="field">
      <label>父牛</label>

      <input
        id="father"
        type="text"
        placeholder="父牛の個体番号など"
        autocomplete="off"
      >
    </div>

    <div class="field">
      <label>母牛</label>

      <input
        id="mother"
        type="text"
        placeholder="母牛の個体番号など"
        autocomplete="off"
      >
    </div>

    <div class="field">
      <label>出生時体重（kg）</label>

      <input
        id="birthWeight"
        type="number"
        inputmode="decimal"
        placeholder="例：32"
      >
    </div>

  </section>


  <section class="form-section">

    <div class="section-title">📷 出生時の写真</div>

    <label class="photo-label" for="birthPhoto">
      📸 出生時の写真を選ぶ
    </label>

    <input
      id="birthPhoto"
      type="file"
      accept="image/*"
      onchange="previewBirthPhoto(event)"
    >

    <img
      id="birthPreview"
      class="photo-preview"
      alt="出生時写真"
    >

  </section>


  <section class="form-section">

    <div class="section-title">🌱 成長中の写真</div>

    <label class="photo-label" for="growthPhotos">
      ＋ 成長写真を複数追加
    </label>

    <input
      id="growthPhotos"
      type="file"
      accept="image/*"
      multiple
      onchange="previewGrowthPhotos(event)"
    >

    <div id="growthPreviewList" class="growth-list"></div>

  </section>


  <section class="form-section">

    <div class="section-title">🚚 出荷情報</div>

    <div class="field">
      <label>出荷日</label>
      <div class="filter-row">
  <select id="shipYear"></select>
  <select id="shipMonth"></select>
  <select id="shipDay"></select>
</div>
    </div>

    <div class="field">
      <label>出荷体重（kg）</label>

      <input
        id="shipWeight"
        type="number"
        inputmode="decimal"
        placeholder="例：750"
      >
    </div>

    <div class="field">
      <label>出荷価格（円）</label>

      <input
        id="shipPrice"
        type="number"
        inputmode="numeric"
        placeholder="例：1200000"
      >
    </div>

    <div class="field">

      <label>出荷時の写真</label>

      <label class="photo-label" for="shipPhoto">
        📸 出荷時の写真を選ぶ
      </label>

      <input
        id="shipPhoto"
        type="file"
        accept="image/*"
        onchange="previewShipPhoto(event)"
      >

      <img
        id="shipPreview"
        class="photo-preview"
        alt="出荷時写真"
      >

    </div>

  </section>


  <button
    id="saveButton"
    class="main-button"
    onclick="saveCow()"
  >
    💾 この牛を登録する
  </button>

  <div class="bottom-space"></div>

</main>


<!-- アルバム -->
<main id="albumScreen" class="screen hidden">

  <button class="back-button" onclick="showHome()">
    ← 牛の一覧に戻る
  </button>

  <div id="albumContent"></div>

  <div class="bottom-space"></div>

</main>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://vasaicuwnugaubeztbhq.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_xJkaK7fpsoK_I5du1JyozQ_utuTqL0D";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

let currentUser = null;
let cows = [];
let currentBirthPhoto = "";
let currentShipPhoto = "";
let currentGrowthPhotos = [];
let editingCowIndex = null;

async function login() {
  const email=document.getElementById("loginEmail").value.trim();
  const password=document.getElementById("loginPassword").value;
  const errorBox=document.getElementById("loginError");
  errorBox.textContent="";
  if(!email||!password){ errorBox.textContent="メールアドレスとパスワードを入力してください。"; return; }
  const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error){ errorBox.textContent="ログインできませんでした。メールアドレスまたはパスワードを確認してください。"; return; }
  currentUser=data.user;
  document.getElementById("loginScreen").style.display="none";
  document.getElementById("app").style.display="block";
  await loadCows();
  showHome();
}

async function loadCows() {
  const {data,error}=await supabaseClient.from("cows").select("*").order("id",{ascending:true});
  if(error){ alert("牛のデータを読み込めませんでした。\n"+error.message); return; }
  cows=(data||[]).map(row=>({
    dbId:row.id, number:row.individual_id||"", calfName:row.calf_name||"",
    birthDate:row.birth_date||"", gender:row.sex||"", father:row.father||"",
    mother:row.mother||"", birthWeight:row.birth_weight??"",
    shipDate:row.shipment_date||"", shipWeight:row.shipment_weight??"",
    shipPrice:row.shipment_price??"", shipPhoto:row.shipment_photo||"",

function setupDateSelects(prefix) {
  const year = document.getElementById(prefix + "Year");
  const month = document.getElementById(prefix + "Month");
  const day = document.getElementById(prefix + "Day");

  year.innerHTML = '<option value="">年</option>';
  month.innerHTML = '<option value="">月</option>';
  day.innerHTML = '<option value="">日</option>';

  const currentYear = new Date().getFullYear();

  for (let y = 2010; y <= currentYear + 1; y++) {
    year.innerHTML += `<option value="${y}">${y}年</option>`;
  }

  for (let m = 1; m <= 12; m++) {
    month.innerHTML += `<option value="${m}">${m}月</option>`;
  }

  for (let d = 1; d <= 31; d++) {
    day.innerHTML += `<option value="${d}">${d}日</option>`;
  }
}

function getDateValue(prefix) {
  const year = document.getElementById(prefix + "Year").value;
  const month = document.getElementById(prefix + "Month").value;
  const day = document.getElementById(prefix + "Day").value;

  if (!year || !month || !day) return "";

  return `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
}

function setDateValue(prefix, value) {
  if (!value) return;

  const [year, month, day] = value.split("-");

  document.getElementById(prefix + "Year").value = year;
  document.getElementById(prefix + "Month").value = Number(month);
  document.getElementById(prefix + "Day").value = Number(day);
}async function saveCow() {

  };

    birth_date:cow.birthDate||null, sex:cow.gender||null, father:cow.father||null,
    mother:cow.mother||null, birth_weight:cow.birthWeight===""?null:Number(cow.birthWeight),

    error=result.error;
    if(!error&&result.data){ cows.push({dbId:result.data.id,...cow}); alert("🐄 牛を登録しました！"); }

function getFilteredCows() {

  const mother =
    document.getElementById("motherFilter").value;

  const father =
    document.getElementById("fatherFilter").value;

  const sortType =
  document.getElementById("cowSort")?.value ||
  "";

  const filtered =
    cows
      .map((cow, index) => ({
        cow,
        index
      }))
      .filter(item => {

        const cow = item.cow;

        if (mother && cow.mother !== mother) {
          return false;
        }

        if (father && cow.father !== father) {
          return false;
        }

        return true;
      });

  filtered.sort((a, b) => {
    const cowA = a.cow;
    const cowB = b.cow;

    if (!sortType) {
  filtered.sort((a, b) =>
    Number(b.cow.dbId || 0) -
    Number(a.cow.dbId || 0)
  );
  return filtered;
}if (sortType === "registered_desc") {
      return (
        Number(cowB.dbId || 0) -
        Number(cowA.dbId || 0)
      );
    }

    if (sortType === "birth_desc") {
      const dateA = cowA.birthDate || "";
      const dateB = cowB.birthDate || "";
      if (!dateA && !dateB) return a.index - b.index;
      if (!dateA) return 1;
      if (!dateB) return -1;

      return (
        dateB.localeCompare(dateA) ||
        Number(cowB.dbId || 0) -
        Number(cowA.dbId || 0)
      );
    }

    if (sortType === "birth_asc") {
      const dateA = cowA.birthDate || "";
      const dateB = cowB.birthDate || "";
      if (!dateA && !dateB) return a.index - b.index;
      if (!dateA) return 1;
      if (!dateB) return -1;

      return (
        dateA.localeCompare(dateB) ||
        Number(cowB.dbId || 0) -
        Number(cowA.dbId || 0)
      );
    }

    if (sortType === "number_asc") {
      const numberA = String(cowA.number || "").trim();
      const numberB = String(cowB.number || "").trim();

      if (!numberA && !numberB) return a.index - b.index;
      if (!numberA) return 1;
      if (!numberB) return -1;

      return (
        numberA.localeCompare(
          numberB,
          "ja",
          { numeric: true, sensitivity: "base" }
        ) ||
        Number(cowB.dbId || 0) -
        Number(cowA.dbId || 0)
      );
    }

    if (sortType === "weight_desc") {
      const weightA = Number(cowA.shipWeight);
      const weightB = Number(cowB.shipWeight);

      const hasA = weightA > 0;
      const hasB = weightB > 0;

      if (!hasA && !hasB) return a.index - b.index;
      if (!hasA) return 1;
      if (!hasB) return -1;

      return (
        weightB - weightA ||
        Number(cowB.dbId || 0) -
        Number(cowA.dbId || 0)
      );
    }

    if (sortType === "price_desc") {
      const priceA = Number(cowA.shipPrice);
      const priceB = Number(cowB.shipPrice);

      const hasA = priceA > 0;
      const hasB = priceB > 0;

      if (!hasA && !hasB) return a.index - b.index;
      if (!hasA) return 1;
      if (!hasB) return -1;

      return (
        priceB - priceA ||
        Number(cowB.dbId || 0) -
        Number(cowA.dbId || 0)
      );
    }

    return a.index - b.index;
  });

  return filtered;
}

/* =========================================
   母牛別・平均値ランキングを作る
========================================= */

function createParentRanking(parentType, valueType) {

  const groups = {};


  cows.forEach(cow => {

    const parent =
      cow[parentType];


    if (!parent) return;


    if (!groups[parent]) {

      groups[parent] = {
        parent,
        count: 0,
        values: [],
        sampleCow: cow
      };

    }


    /* 登録されている子牛数 */
    groups[parent].count++;


    let value = 0;


    if (valueType === "weight") {

      value = Number(cow.shipWeight);

    } else {

      value = Number(cow.shipPrice);

    }


    /*
      平均値の計算には、
      実際に出荷データが登録されている
      子牛だけを使用
    */

    if (value > 0) {

      groups[parent].values.push(value);

    }

  });


  return Object.values(groups)
    .map(group => {

      if (group.values.length === 0) {
        return null;
      }


      const average =
        group.values.reduce(
          (sum, value) => sum + value,
          0
        ) / group.values.length;


      return {
        parent: group.parent,
        count: group.count,
        shipmentCount: group.values.length,
        average,
        sampleCow: group.sampleCow
      };

    })
    .filter(Boolean)
    .sort((a, b) => b.average - a.average);
}

/* =========================================
   ファイル → DataURL
========================================= */

function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = e => {
      const img = new Image();

      img.onload = () => {
        const maxSize = 1200;

        let width = img.width;
        let height = img.height;

        if (width > maxSize || height > maxSize) {
          if (width >= height) {
            height = Math.round(height * maxSize / width);
            width = maxSize;
          } else {
            width = Math.round(width * maxSize / height);
            height = maxSize;
          }
        }

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);

        resolve(canvas.toDataURL("image/jpeg", 0.75));
      };

      img.onerror = reject;
      img.src = e.target.result;
    };

    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}


/* =========================================
   出生写真
========================================= */

async function previewBirthPhoto(event) {

  const file =
    event.target.files[0];

  if (!file) return;


  currentBirthPhoto =
    await fileToDataURL(file);


  const img =
    document.getElementById("birthPreview");


  img.src = currentBirthPhoto;
  img.style.display = "block";
}

    event.target.files[0];

  currentShipPhoto =
    await fileToDataURL(file);

    document.getElementById("shipPreview");

/* =========================================
   成長写真
========================================= */

async function previewGrowthPhotos(event) {

  const files =
    Array.from(event.target.files);


  if (files.length === 0) {
    return;
  }


  currentGrowthPhotos = [];


  for (const file of files) {

    const data =
      await fileToDataURL(file);

    currentGrowthPhotos.push(data);

  }


  renderGrowthPreview();
}


/* =========================================
   成長写真プレビュー表示
========================================= */

function renderGrowthPreview() {

  const list =
    document.getElementById("growthPreviewList");


  list.innerHTML = "";


  currentGrowthPhotos.forEach(photo => {

    const img =
      document.createElement("img");

    img.src = photo;
    img.className = "growth-preview";
    img.alt = "成長写真";

    list.appendChild(img);

  });
}

/* =========================================
   HTMLエスケープ
========================================= */

function escapeHTML(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
